name: Build history

# Avvio manuale: Actions -> Build history -> Run workflow.
# Al termine, scaricare l'artifact "history" dalla pagina del run.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/build_history.py
      - uses: actions/upload-artifact@v4
        with:
          name: history
          path: data/
